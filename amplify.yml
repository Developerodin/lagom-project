version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            - npx prisma generate
        build:
          commands:
            # SESSION_SECRET must be available at build time for middleware (Edge inlining).
            - test -n "$SESSION_SECRET" || (echo "SESSION_SECRET is required at build time" && exit 1)
            - npm run build
            - npx prisma migrate deploy
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    appRoot: .
